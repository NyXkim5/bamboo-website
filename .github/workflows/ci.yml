name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # Zero-dependency library: no install step. Node's built-in test runner is the green gate.
      - name: Run tests
        run: node --test
      - name: Check registry is up to date
        run: |
          node core/registry.mjs
          git diff --exit-code registry.json \
            || (echo "registry.json is stale — run 'node core/registry.mjs' and commit" && exit 1)
